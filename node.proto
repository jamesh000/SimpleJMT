syntax = "proto3";
package node;

option go_package = "./nodepb";

message Node {
        message InternalNode {
                repeated Child children = 1;
                uint32 bitmap = 2;
                uint32 leaves = 3;
        }

        message LeafNode {
                bytes id = 1;
                bytes valueHash = 2;
        }

        oneof body {
              InternalNode internal = 1;
              LeafNode leaf = 2;
        }
}

message Child {
        uint64 version = 1;
        bytes valueHash = 2;
        uint32 type = 3;
}